<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relatórios de Estoque</title>
  <link rel="stylesheet" href="./static/css/styles.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 260px;
      background: #1d3557;
      color: #fff;
      display: flex;
      flex-direction: column;
      padding-top: 20px;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 300;
    }

    .sidebar a {
      padding: 15px 25px;
      text-decoration: none;
      color: #fff;
      display: block;
      transition: 0.3s;
      font-size: 15px;
    }

    .sidebar a:hover {
      background: #457b9d;
    }

    .main {
      flex: 1;
      padding: 30px;
    }

    .header {
      font-size: 24px;
      margin-bottom: 25px;
      color: #1d3557;
      font-weight: 500;
    }

    .filters {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 3px 7px rgba(0, 0, 0, 0.07);
      margin-bottom: 25px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .filters .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 14px;
      margin-bottom: 6px;
      color: #1d3557;
      font-weight: 500;
    }

    input,
    select {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #d2d6db;
      font-size: 14px;
    }

    button {
      background: #1d3557;
      border: none;
      padding: 10px 18px;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
      margin-top: auto;
      height: 42px;
    }

    button:hover {
      background: #457b9d;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 3px 7px rgba(0, 0, 0, 0.07);
    }

    th,
    td {
      padding: 12px 14px;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #1d3557;
      color: #fff;
    }

    tr:nth-child(even) {
      background: #f1f4f6;
    }
  </style>
</head>

<body>
  <aside class="sidebar">
    <h2>ESTOQUE</h2>
    <a href="index.html">Dashboard</a>
    <a href="cadastro_produto.html">Cadastro de Produtos</a>
    <a href="entrada_produto.html">Entrada de Produtos</a>
    <a href="saida_produto.html">Baixa / Saída</a>
    <a href="#" style="background:#457b9d;">Relatórios</a>
  </aside>

  <main class="main">
    <div class="header">Relatórios de Estoque</div>

    <div class="filters">
      <div class="form-group">
        <label>Produto</label>
        <select>
          <option>Todos</option>
        </select>
      </div>
      <div class="form-group">
        <label>Tipo</label>
        <select>
          <option>Todos</option>
          <option>Entrada</option>
          <option>Saída</option>
        </select>
      </div>
      <div class="form-group">
        <label>Data Inicial</label>
        <input type="date" />
      </div>
      <div class="form-group">
        <label>Data Final</label>
        <input type="date" />
      </div>
      <button>Filtrar</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Produto</th>
          <th>Tipo</th>
          <th>Quantidade</th>
          <th>Responsável</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>--/--/----</td>
          <td>---</td>
          <td>---</td>
          <td>---</td>
          <td>---</td>
        </tr>
      </tbody>
    </table>

  </main>
</body>

</html>
