<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saída de Produtos</title>
    <link rel="stylesheet" href="./static/css/styles.css" />
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: #1d3557;
            color: #fff;
            display: flex;
            flex-direction: column;
            padding-top: 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .sidebar a {
            padding: 15px 25px;
            text-decoration: none;
            color: #fff;
            display: block;
            transition: 0.3s;
            font-size: 15px;
        }

        .sidebar a:hover {
            background: #457b9d;
        }

        .main {
            flex: 1;
            padding: 30px;
        }

        .header {
            font-size: 24px;
            margin-bottom: 25px;
            color: #1d3557;
            font-weight: 500;
        }

        form {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 3px 7px rgba(0, 0, 0, 0.07);
            max-width: 600px;
        }

        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-size: 14px;
            color: #1d3557;
            font-weight: 500;
        }

        input,
        select,
        textarea {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #d2d6db;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
        }

        button {
            background: #1d3557;
            border: none;
            padding: 12px 20px;
            color: #fff;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #457b9d;
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <h2>ESTOQUE</h2>
        <a href="index.html">Dashboard</a>
        <a href="cadastro_produto.html">Cadastro de Produtos</a>
        <a href="entrada_produto.html">Entrada de Produtos</a>
        <a href="#" style="background:#457b9d;">Baixa / Saída</a>
        <a href="relatorios.html">Relatórios</a>
    </aside>

    <main class="main">
        <div class="header">Baixa / Saída de Produtos</div>

        <form>
            <div class="form-group">
                <label>Produto</label>
                <select>
                    <option>Selecione o produto</option>
                </select>
            </div>

            <div class="form-group">
                <label>Quantidade a dar baixa</label>
                <input type="number" min="1" placeholder="Ex: 5" />
            </div>

            <div class="form-group">
                <label>Motivo da Saída</label>
                <select>
                    <option>Venda</option>
                    <option>Consumo Interno</option>
                    <option>Perda / Avaria</option>
                    <option>Ajuste de Inventário</option>
                </select>
            </div>

            <div class="form-group">
                <label>Observações (opcional)</label>
                <textarea rows="3" placeholder="Ex: Produto danificado no transporte"></textarea>
            </div>

            <button type="submit">Registrar Baixa</button>
        </form>
    </main>
</body>

</html>
