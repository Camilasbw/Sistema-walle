<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Sistema de Estoque{% endblock %}</title>

    <!-- Exemplo de estilos -->
    <style>
        .sidebar {
width: 260px;
background: #1d3557;
color: #fff;
display: flex;
flex-direction: column;
padding-top: 20px;
}


.sidebar h2 {
text-align: center;
margin-bottom: 30px;
font-weight: 300;
}


.sidebar a {
padding: 15px 25px;
text-decoration: none;
color: #fff;
display: block;
transition: 0.3s;
font-size: 15px;
}


.sidebar a:hover {
background: #457b9d;
}

    </style>
</head>
<body>

<div class="layout-container">

    <!-- Inclui o sidebar reutilizável -->
    {% include 'layout/sidebar.html' %}

    <main class="main">
        {% block conteudo %}
        {% endblock %}
    </main>

</div>

</body>
</html>
